<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Talent Vault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">TV</div>
      <div>
        <div class="brand-title">Talent Vault</div>
      </div>
    </div>
    <div class="endpoint-badge" id="apiEndpointBadge">API: Active</div>
  </div>

  <div class="mode-switcher">
    <button type="button" id="parsingModeBtn" class="mode-tab active">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
      Parsing Mode
    </button>
    <button type="button" id="manualModeBtn" class="mode-tab">
      <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Manual Mode
    </button>
  </div>

  <div class="container">
    <div id="statusAlert" class="alert hidden"></div>

    <div id="extractCard" class="card action-card">
      <div id="parsingStatus" class="parsing-status hidden">
        <span class="spinner"></span>
        <span>Parsing active page…</span>
      </div>
      <div id="parseError" class="alert alert-error hidden"></div>
      <button type="button" id="parseBtn" class="btn btn-primary btn-block">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Parse Profile
      </button>
      <button type="button" id="retryBtn" class="btn btn-outline btn-block hidden">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 11-3-6.7L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
        Retry Parse
      </button>
    </div>

    <form id="candidateForm" class="hidden">
      <div class="card">
        <div class="card-header">
          <span>Candidate Information</span>
          <span id="sourceBadge" class="source-tag">Source: LINKEDIN</span>
        </div>

        <div class="form-group">
          <label for="recruiterEmail">Recruiter Email (your login)</label>
          <input type="email" id="recruiterEmail" placeholder="e.g. you@company.com">
        </div>

        <div class="form-group">
          <label for="fieldName">Full Name *</label>
          <input type="text" id="fieldName" placeholder="e.g. Ananya Deshmukh">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="fieldEmail">Email <span id="emailStatusBadge" class="status-badge hidden"></span></label>
            <input type="email" id="fieldEmail" placeholder="e.g. candidate@example.com">
          </div>
          <div class="form-group flex-1">
            <label for="fieldPhone">Phone Number <span id="phoneStatusBadge" class="status-badge hidden"></span></label>
            <input type="text" id="fieldPhone" placeholder="e.g. +91 9876543210">
          </div>
        </div>

        <div class="form-group">
          <label for="fieldHeadline">Headline / Designation</label>
          <input type="text" id="fieldHeadline" placeholder="e.g. Principal AI Architect">
        </div>

        <div class="form-group">
          <label for="fieldCurrentCompany">Current Company</label>
          <input type="text" id="fieldCurrentCompany" placeholder="e.g. NVIDIA">
        </div>

        <div class="form-group">
          <label for="fieldLocation">Location</label>
          <input type="text" id="fieldLocation" placeholder="e.g. Bengaluru, Karnataka, India">
        </div>

        <div class="form-group">
          <label for="fieldSummary">About / Professional Summary</label>
          <textarea id="fieldSummary" rows="3" placeholder="Candidate profile summary..."></textarea>
        </div>

        <div class="form-group">
          <label for="fieldProfileUrl">LinkedIn URL</label>
          <input type="text" id="fieldProfileUrl" placeholder="https://www.linkedin.com/in/username/">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="fieldTotalExperience">Total Experience (yrs)</label>
            <input type="number" step="0.1" id="fieldTotalExperience" placeholder="e.g. 5.5">
          </div>
          <div class="form-group flex-1">
            <label for="fieldNoticePeriod">Notice Period (days)</label>
            <input type="number" id="fieldNoticePeriod" placeholder="30">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="fieldCurrentSalary">Current CTC (LPA)</label>
            <input type="number" step="0.1" id="fieldCurrentSalary" placeholder="e.g. 15.0">
          </div>
          <div class="form-group flex-1">
            <label for="fieldExpectedSalary">Expected CTC (LPA)</label>
            <input type="number" step="0.1" id="fieldExpectedSalary" placeholder="e.g. 20.0">
          </div>
        </div>

        <div class="form-group">
          <label for="fieldSkills">Skills (comma-separated)</label>
          <input type="text" id="fieldSkills" placeholder="Python, PyTorch, CUDA, Django">
        </div>
      </div>

      <!-- Contact Enrichment Section -->
      <div class="card">
        <div class="card-header">
          <span>Contact Enrichment</span>
          <span class="source-tag source-manual">LOCAL</span>
        </div>
        <div class="form-row">
          <button type="button" id="findEmailBtn" class="btn btn-outline flex-1">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            Find Email
          </button>
          <button type="button" id="findPhoneBtn" class="btn btn-outline flex-1">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/>
            </svg>
            Find Phone
          </button>
        </div>
        <button type="button" id="enrichBtn" class="btn btn-primary btn-block">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
          </svg>
          Enrich Candidate
        </button>
      </div>

      <!-- Experience Section -->
      <div class="card">
        <div class="card-header">
          <span>Work Experience (<span id="expCount">0</span>)</span>
          <button type="button" id="addExpBtn" class="btn-sm btn-outline">+ Add Entry</button>
        </div>
        <div id="experienceList" class="dynamic-list"></div>
        <textarea id="fieldExperience" class="hidden"></textarea>
      </div>

      <!-- Education Section -->
      <div class="card">
        <div class="card-header">
          <span>Education (<span id="eduCount">0</span>)</span>
          <button type="button" id="addEduBtn" class="btn-sm btn-outline">+ Add Entry</button>
        </div>
        <div id="educationList" class="dynamic-list"></div>
        <textarea id="fieldEducation" class="hidden"></textarea>
      </div>

      <!-- Projects Section -->
      <div class="card">
        <div class="card-header">
          <span>Projects (<span id="projCount">0</span>)</span>
          <button type="button" id="addProjBtn" class="btn-sm btn-outline">+ Add Entry</button>
        </div>
        <div id="projectsList" class="dynamic-list"></div>
      </div>

      <!-- Certifications Section -->
      <div class="card">
        <div class="card-header">
          <span>Certifications (<span id="certCount">0</span>)</span>
          <button type="button" id="addCertBtn" class="btn-sm btn-outline">+ Add Entry</button>
        </div>
        <div id="certificationsList" class="dynamic-list"></div>
      </div>

      <!-- Resume Attachment Section -->
      <div id="resumeSection" class="card hidden">
        <div class="card-header">
          <span>Resume Attachment</span>
          <span class="source-tag">DOWNLOADABLE</span>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="attachResumeCheckbox" style="accent-color:#2563eb;">
          <span>Attach candidate's real resume file to CRM profile</span>
        </label>
        <div id="resumeBadge" class="resume-badge hidden"></div>
      </div>

      <!-- Manual Resume Upload Section -->
      <div class="card">
        <div class="card-header">
          <span>Manual Resume Upload</span>
          <span class="source-tag source-manual">MANUAL</span>
        </div>
        <div class="form-group">
          <label for="manualResumeUpload">Attach a resume file (PDF / DOC / DOCX)</label>
          <input type="file" id="manualResumeUpload" accept=".pdf,.doc,.docx">
          <span id="selectedFileName" class="resume-badge hidden"></span>
        </div>
      </div>

      <div class="card action-card">
        <button type="button" id="saveBtn" class="btn btn-success btn-block">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Save Candidate
        </button>
      </div>
    </form>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
