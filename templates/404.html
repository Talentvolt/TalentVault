{% extends "layouts/recruiter_base.html" %}
{% block title %}404 Page Not Found - TalentVault{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm mx-auto" style="max-width: 500px; border-radius: 12px;">
        <div class="card-body p-5">
            <h1 class="display-1 text-primary fw-bold">404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">{{ message|default:"The page or record you requested does not exist or was moved." }}</p>
            <a href="/" class="btn btn-primary px-4 py-2">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
