<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Browser Favicons & Web Manifest -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/logo/favicon-16x16.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/logo/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="48x48" href="{% static 'images/logo/favicon-48x48.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/logo/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'images/logo/site.webmanifest' %}">
    <title>Authentication Error Details</title>
</head>
<body>
    <h2>Authentication Error Details</h2>
    <p><strong>exception:</strong> {{ exception }}</p>
    <p><strong>error:</strong> {{ error }}</p>
    <p><strong>auth_error:</strong> {{ auth_error }}</p>
    <p><strong>auth_error.code:</strong> {{ auth_error.code }}</p>
    <p><strong>auth_error.description:</strong> {{ auth_error.description }}</p>
    <p><strong>auth_error.exception:</strong> {{ auth_error.exception }}</p>
</body>
</html>
