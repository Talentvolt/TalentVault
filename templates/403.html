{% extends "layouts/recruiter_base.html" %}
{% block title %}403 Permission Denied - TalentVault{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm mx-auto" style="max-width: 500px; border-radius: 12px;">
        <div class="card-body p-5">
            <h1 class="display-1 text-danger fw-bold">403</h1>
            <h3 class="mb-3">Access Restricted</h3>
            <p class="text-muted mb-4">{{ message|default:"You do not have permission to access this resource or perform this action." }}</p>
            <a href="/" class="btn btn-primary px-4 py-2">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
