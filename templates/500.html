{% extends "layouts/recruiter_base.html" %}
{% block title %}500 Internal Server Error - TalentVault{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm mx-auto" style="max-width: 500px; border-radius: 12px;">
        <div class="card-body p-5">
            <h1 class="display-1 text-danger fw-bold">500</h1>
            <h3 class="mb-3">Something Went Wrong</h3>
            <p class="text-muted mb-4">{{ message|default:"An unexpected server error occurred. Our engineering team has been notified." }}</p>
            <a href="/" class="btn btn-primary px-4 py-2">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
