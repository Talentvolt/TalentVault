<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TalentVault Contact Enrichment</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --dark: #0f172a;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: var(--text);
      width: 360px;
      min-height: 520px;
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      background: var(--dark);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-weight: 700; font-size: 14px; }
    .brand-subtitle { font-size: 10px; color: #94a3b8; }
    .container { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .card-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }
    .status {
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
      margin-top: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 6px;
      font-weight: 600;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      margin-top: 10px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .65; cursor: not-allowed; }
    .enr-row { margin-bottom: 3px; }
    .enr-row:last-child { margin-bottom: 0; }
    .enr-cand { font-size: 11px; color: #334155; padding: 2px 0 2px 8px; word-break: break-all; }
    .enr-pat { color: #64748b; }
    .enr-status-ok { color: #15803d; font-weight: 600; }
    .enr-status-bad { color: #b45309; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">TV</div>
      <div>
        <div class="brand-title">TalentVault</div>
        <div class="brand-subtitle">Contact Enrichment</div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Candidate Details (auto-populated from the active LinkedIn profile) -->
    <div class="card">
      <div class="card-header">Candidate Details</div>
      <div class="field">
        <label for="cand-name">Name</label>
        <input type="text" id="cand-name" placeholder="Scraped from profile…" readonly />
      </div>
      <div class="field">
        <label for="cand-headline">Headline</label>
        <input type="text" id="cand-headline" placeholder="Scraped from profile…" readonly />
      </div>
      <div class="field">
        <label for="cand-company">Current Company / Domain</label>
        <input type="text" id="cand-company" placeholder="e.g. NVIDIA or nvidia.com" />
      </div>
      <button type="button" id="scrape-btn" class="btn">Scrape Profile</button>
      <div class="status" id="scrape-status">Waiting to scrape profile…</div>
    </div>

    <!-- Enrichment widget loads here (rendered by EnrichmentModule) -->
    <div id="enrichment-mount"></div>
  </div>

  <!-- EnrichmentModule (UMD: also available as window.EnrichmentModule) -->
  <script src="enrichment-module.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
