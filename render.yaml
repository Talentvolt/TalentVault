services:
  - type: web
    name: talentvault
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py setup_google_app && python manage.py preload_ocr
    startCommand: gunicorn config.wsgi:application -c gunicorn.conf.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.base
      - key: PYTHON_VERSION
        value: 3.11.9
      # HireNest Australia employer approvals integration (server-to-server).
      - key: HIRENEST_API_BASE_URL
        value: https://hirenest.com.au
      - key: HIRENEST_ADMIN_API_KEY
        sync: false
